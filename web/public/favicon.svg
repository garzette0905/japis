<!-- 탭에 서는 표 — 앱 아이콘과 같은 그림이다.
     파란 라운드 사각 한 장 위에 흰 J 하나, 고리 안에 구슬 하나.

     글씨는 판을 가득 채우지 않는다. 512칸 안에서 J 의 키는 346(≈68%)이고,
     나머지는 여백으로 남긴다 — 안드로이드·iOS 가 아이콘을 다시 잘라 낼 때
     (maskable) 글씨가 잘리지 않으려면 이 여백이 있어야 하고, 런처의 다른
     아이콘과 나란히 섰을 때도 글씨가 판 밖으로 비어져 나와 보이지 않는다.
     (예전 판은 78%였다 — 작은 칸에서 J 가 판을 밀어내는 것처럼 보였다.)

     판과 글씨 **둘 다** 그라디에이션이다. 판은 왼위(#2450f2)에서 오른아래
     (#061a97)로, 글씨는 오른위(#ffffff)에서 왼아래(#b3cdfa)로 — 서로 반대
     방향으로 흘러야 글씨가 판에서 떠 보인다.

     png(icon-192·icon-512·apple-touch-icon·og-japis)는 이 좌표를 그대로 구운
     것이다. 고칠 때는 tools/make-icons.py 를 다시 돌린다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="JAPIS">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2450f2"/>
      <stop offset=".55" stop-color="#0f31c8"/>
      <stop offset="1" stop-color="#061a97"/>
    </linearGradient>
    <!-- 글씨의 그라디에이션은 **J 하나를 통째로** 흐른다.
         기본값(objectBoundingBox)으로 두면 가로대·기둥·고리가 **저마다** 흰색에서
         시작해 색이 토막토막 끊긴다. J 의 테두리 상자(107,54)-(407,456)를
         직접 적어 다섯 덩어리가 한 장처럼 흐르게 한다(png 도 같은 상자다). -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="407" y1="54" x2="107" y2="456">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b3cdfa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#plate)"/>
  <!-- J 를 제자리(중심 257,255)에서 0.86배로 줄여 판 가운데(256,256)에 세운다 -->
  <g fill="url(#ink)" transform="translate(256 256) scale(.86) translate(-257 -255)">
    <rect x="150" y="54" width="257" height="92" rx="46"/>
    <!-- 기둥의 키가 252(=고리가 시작하는 306)가 아니라 254 인 것은 일부러다.
         맞닿기만 하면 브라우저가 두 덩어리의 테두리를 따로 부드럽게 칠해
         그 줄에 가느다란 실금이 남는다 — 두 칸 겹쳐 두면 그 줄이 사라진다. -->
    <rect x="315" y="54" width="92" height="254"/>
    <path d="M407 306A150 150 0 0 1 107 306L199 306A58 58 0 0 0 315 306Z"/>
    <circle cx="153" cy="306" r="46"/>
    <circle cx="257" cy="296" r="40"/>
  </g>
</svg>

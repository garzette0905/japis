<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>JAPIS</title>
<meta name="description" content="Jaden's Automated Personal Intelligence Service">
<!-- 개인 포털이다. 검색에 걸릴 이유가 없다. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!--
  껍데기에는 아무 메뉴도 없다.
  로그인 화면만 마크업으로 두고, 상단 메뉴·서비스 카드·관리자 화면은 전부 app.js 가
  /api/status 응답을 받은 뒤에 만든다. 그래서 로그인하지 않은 사람은 페이지 소스를 봐도
  어떤 화면이 있는지 알 수 없다.
-->

<!-- 뜨는 동안의 빈 화면. app.js 가 판단을 끝내면 지운다. -->
<div id="boot" class="boot"><span class="spinner" aria-hidden="true"></span></div>

<!-- ① 인증 화면 — 로그인 전에는 이것만 존재한다 -->
<main id="gate" class="gate" hidden>
  <div class="gate-night" aria-hidden="true">
    <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
    <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
    <div class="gate-brand">
      <div class="gate-logo">JAPIS</div>
      <p class="gate-tag">Jaden&rsquo;s Automated<br>Personal Intelligence Service</p>
      <p class="gate-sub">흩어진 나의 서비스를 한자리에서.</p>
    </div>
  </div>

  <div class="gate-panel">
    <div class="auth-card">
      <!-- 로그인 -->
      <section id="view-login">
        <span class="badge-pill">Personal Portal</span>
        <h1 class="auth-title">로그인</h1>
        <p class="auth-lead">등록된 계정만 들어올 수 있습니다.</p>
        <form id="form-login" novalidate>
          <label class="field">
            <span class="field-label">이메일</span>
            <input id="login-email" type="email" name="email" autocomplete="username"
                   inputmode="email" placeholder="name@example.com" required>
          </label>
          <label class="field">
            <span class="field-label">비밀번호</span>
            <input id="login-password" type="password" name="password" autocomplete="current-password"
                   placeholder="비밀번호">
            <span class="field-hint">최초 로그인이라면 비워 두고 눌러주세요.</span>
          </label>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button id="login-submit" class="btn-primary btn-block" type="submit">로그인</button>
        </form>
      </section>

      <!-- 비밀번호 설정 (최초 로그인 직후 · 강제) -->
      <section id="view-setpw" hidden>
        <span class="badge-pill">보안</span>
        <h1 class="auth-title">비밀번호 설정</h1>
        <p class="auth-lead" id="setpw-lead">계속하려면 비밀번호를 정해주세요.</p>
        <form id="form-setpw" novalidate>
          <label class="field" id="field-current" hidden>
            <span class="field-label">현재 비밀번호</span>
            <input id="setpw-current" type="password" autocomplete="current-password">
          </label>
          <label class="field">
            <span class="field-label">새 비밀번호</span>
            <input id="setpw-next" type="password" autocomplete="new-password" required>
            <span class="field-hint">8자 이상, 영문과 숫자를 함께.</span>
          </label>
          <label class="field">
            <span class="field-label">새 비밀번호 확인</span>
            <input id="setpw-confirm" type="password" autocomplete="new-password" required>
          </label>
          <p id="setpw-error" class="form-error" role="alert" hidden></p>
          <button id="setpw-submit" class="btn-primary btn-block" type="submit">비밀번호 저장</button>
          <button id="setpw-cancel" class="btn-text btn-block" type="button">로그아웃</button>
        </form>
      </section>
    </div>
    <p class="gate-foot">JAPIS · Cloudflare Workers</p>
  </div>
</main>

<!-- ② 포털 — 로그인한 뒤에만 채워진다 (app.js) -->
<div id="app" hidden>
  <header class="nav" id="nav"></header>
  <main class="page" id="page"></main>
  <footer class="foot" id="foot"></footer>
</div>

<!-- ③ 화면 잠금해제(재인증) 모달 -->
<div id="lock" class="modal" hidden>
  <div class="modal-scrim" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <div class="modal-icon" id="lock-icon">🔒</div>
    <h2 class="modal-title" id="lock-title">화면 잠금 해제</h2>
    <p class="modal-lead" id="lock-lead">비밀번호를 한 번 더 확인합니다.</p>
    <form id="form-lock" novalidate>
      <label class="field">
        <span class="field-label">비밀번호</span>
        <input id="lock-password" type="password" autocomplete="current-password" required>
      </label>
      <p id="lock-error" class="form-error" role="alert" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-close>취소</button>
        <button type="submit" class="btn-primary" id="lock-submit">확인</button>
      </div>
    </form>
    <div id="lock-done" hidden>
      <p class="modal-ok">인증되었습니다.</p>
      <a id="lock-open" class="btn-primary btn-block" href="#" target="_blank" rel="noopener noreferrer">열기</a>
      <p class="modal-note" id="lock-note"></p>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>

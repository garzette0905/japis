<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>JAPIS</title>
<meta name="description" content="JAden Personal Intelligence Service">
<!-- 개인 포털이다. 검색에 걸릴 이유가 없다. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ddd9e4">
<!-- 주소를 누구에게 보내든 미리보기 카드에 JAPIS 로고가 서게 한다(흰 종이 한 장 대신). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="JAPIS">
<meta property="og:title" content="JAPIS">
<meta property="og:description" content="JAden Personal Intelligence Service — 흩어진 나의 서비스를 한자리에서.">
<meta property="og:image" content="/og-japis.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter(라틴) + Noto Sans KR(한글). 간판 글씨(로고)만 Bebas Neue. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<!-- Jaden wiki(포털 안 메모) 화면의 스타일. 본 화면과 섞이지 않게 파일을 나눠 둔다. -->
<link rel="stylesheet" href="/wiki.css">
<!-- 북마크 화면(업무·개인 주소록)의 스타일. 역시 본 화면과 섞이지 않게 나눠 둔다. -->
<link rel="stylesheet" href="/bookmarks.css">
<!-- Play Lists(가수·곡) 화면의 스타일. -->
<link rel="stylesheet" href="/playlists.css">
</head>
<body>

<!--
  껍데기에는 아무 메뉴도 없다.
  로그인 화면만 마크업으로 두고, 상단 메뉴·서비스 카드·관리자 화면은 전부 app.js 가
  /api/status 응답을 받은 뒤에 만든다. 그래서 로그인하지 않은 사람은 페이지 소스를 봐도
  어떤 화면이 있는지 알 수 없다.
-->

<!-- 뜨는 동안의 빈 화면. app.js 가 판단을 끝내면 지운다. -->
<div id="boot" class="boot"><span class="spinner" aria-hidden="true"></span></div>

<!-- ① 인증 화면 — 로그인 전에는 이것만 존재한다 -->
<main id="gate" class="gate" hidden>
  <div class="gate-night" aria-hidden="true">
    <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
    <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
    <div class="gate-brand">
      <!-- 앱 아이콘과 같은 마크. 간판 글씨 위에 한 장 세운다. -->
      <img class="gate-mark" src="/icon-192.png" width="54" height="54" alt="" aria-hidden="true">
      <div class="gate-logo">JAPIS</div>
      <p class="gate-tag">JAden Personal<br>Intelligence Service</p>
      <p class="gate-sub">흩어진 나의 서비스를 한자리에서.</p>
    </div>
  </div>

  <div class="gate-panel">
    <div class="auth-card">
      <!-- 로그인 -->
      <section id="view-login">
        <span class="badge-pill">Personal Portal</span>
        <h1 class="auth-title">로그인</h1>
        <p class="auth-lead">등록된 계정만 들어올 수 있습니다.</p>
        <form id="form-login" novalidate>
          <label class="field">
            <span class="field-label">이메일</span>
            <input id="login-email" type="email" name="email" autocomplete="username"
                   inputmode="email" placeholder="name@example.com" required>
          </label>
          <label class="field">
            <span class="field-label">비밀번호</span>
            <input id="login-password" type="password" name="password" autocomplete="current-password"
                   placeholder="비밀번호">
            <span class="field-hint">최초 로그인이라면 비워 두고 눌러주세요.</span>
          </label>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button id="login-submit" class="btn-primary btn-block" type="submit">로그인</button>
        </form>

        <!-- 생체인증 — 이 기기에 패스키를 등록해 둔 사람에게만 app.js 가 열어 준다 -->
        <div id="login-bio-wrap" hidden>
          <div class="or-line"><span>또는</span></div>
          <button id="login-bio" class="btn-secondary btn-block" type="button">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="10" width="15" height="10.5" rx="1.75"/><path d="M8 10V7.5a4 4 0 0 1 7.7-1.5"/></svg> 생체인증으로 로그인
          </button>
          <p class="field-hint" style="text-align:center">지문·얼굴로 바로 들어옵니다.</p>
        </div>
      </section>

      <!-- 비밀번호 설정 (최초 로그인 직후 · 강제) -->
      <section id="view-setpw" hidden>
        <span class="badge-pill">보안</span>
        <h1 class="auth-title">비밀번호 설정</h1>
        <p class="auth-lead" id="setpw-lead">계속하려면 비밀번호를 정해주세요.</p>
        <form id="form-setpw" novalidate>
          <label class="field" id="field-current" hidden>
            <span class="field-label">현재 비밀번호</span>
            <input id="setpw-current" type="password" autocomplete="current-password">
          </label>
          <label class="field">
            <span class="field-label">새 비밀번호</span>
            <input id="setpw-next" type="password" autocomplete="new-password" required>
            <span class="field-hint">8자 이상, 영문과 숫자를 함께.</span>
          </label>
          <label class="field">
            <span class="field-label">새 비밀번호 확인</span>
            <input id="setpw-confirm" type="password" autocomplete="new-password" required>
          </label>
          <p id="setpw-error" class="form-error" role="alert" hidden></p>
          <button id="setpw-submit" class="btn-primary btn-block" type="submit">비밀번호 저장</button>
          <button id="setpw-cancel" class="btn-text btn-block" type="button">로그아웃</button>
        </form>
      </section>
    </div>
    <p class="gate-foot">JAPIS · Cloudflare Workers</p>
  </div>
</main>

<!-- ② 포털 — 로그인한 뒤에만 채워진다 (app.js)
     상단 띠(nav)에는 로고·'지금'(날짜·시간·날씨)·계정만 둔다.
     화면 목록은 왼쪽 기둥(side)이 글자로만 세로로 세운다. -->
<div id="app" hidden>
  <header class="nav" id="nav"></header>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="page" id="page"></main>

    <!-- 오른쪽 프레임 — 바깥 화면을 포털을 떠나지 않고 이 자리에서 연다.
         src 에는 실제 주소가 아니라 /go/<key> 를 넣는다. 주소는 서버만 안다는
         규칙이 프레임에서도 그대로다(302 는 프레임이 알아서 따라간다). -->
    <section class="frame" id="frame" hidden aria-label="열어 둔 화면">
      <div class="frame-bar">
        <span class="frame-icon" id="frame-icon" aria-hidden="true"></span>
        <span class="frame-title" id="frame-title"></span>
        <button class="frame-btn" id="frame-reload" type="button" title="새로 고침" aria-label="새로 고침"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5V10h-5.5"/></svg></button>
        <button class="frame-btn" id="frame-pop" type="button" title="새 창에서 열기" aria-label="새 창에서 열기"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 5h10v10"/><path d="M19 5 9.5 14.5"/><path d="M15 19H5V9"/></svg></button>
        <button class="frame-btn" id="frame-close" type="button" title="닫기" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12"/><path d="m18 6-12 12"/></svg></button>
      </div>
      <div class="frame-body" id="frame-body"></div>
    </section>
  </div>
  <footer class="foot" id="foot"></footer>
</div>

<!-- ③ 화면 잠금해제(재인증) 모달 -->
<div id="lock" class="modal" hidden>
  <div class="modal-scrim" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <div class="modal-icon" id="lock-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="10" width="15" height="10.5" rx="1.75"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg></div>
    <h2 class="modal-title" id="lock-title">화면 잠금 해제</h2>
    <p class="modal-lead" id="lock-lead">비밀번호를 한 번 더 확인합니다.</p>
    <form id="form-lock" novalidate>
      <!-- 이 기기에 등록해 둔 생체인증이 있으면 비밀번호 대신 이것을 먼저 권한다 -->
      <div id="lock-bio-wrap" hidden>
        <button id="lock-bio" class="btn-primary btn-block" type="button">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="10" width="15" height="10.5" rx="1.75"/><path d="M8 10V7.5a4 4 0 0 1 7.7-1.5"/></svg> 생체인증으로 열기
        </button>
        <div class="or-line"><span>또는 비밀번호</span></div>
      </div>
      <label class="field">
        <span class="field-label">비밀번호</span>
        <input id="lock-password" type="password" autocomplete="current-password" required>
      </label>
      <p id="lock-error" class="form-error" role="alert" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-close>취소</button>
        <button type="submit" class="btn-primary" id="lock-submit">확인</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
